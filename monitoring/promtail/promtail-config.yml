server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: audit-logs
    static_configs:
      - targets:
          - localhost
        labels:
          app: easeport
          log_type: audit
          __path__: /logs/audit-*.log

  - job_name: audit-logs-current
    static_configs:
      - targets:
          - localhost
        labels:
          app: easeport
          log_type: audit
          __path__: /logs/audit.log
